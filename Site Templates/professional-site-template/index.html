<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f3a5f" />

    <!-- Per-page title/description/OG tags are set at runtime by src/components/Seo.tsx
         from src/config/site.ts. These are the fallbacks for crawlers that skip JS. -->
    <title>Your Business Name | Professional Services</title>
    <meta name="description" content="A short description of your business and who you help." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Your Business Name | Professional Services" />
    <meta property="og:description" content="A short description of your business and who you help." />
    <meta property="og:image" content="https://www.example.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Your Business Name",
        "url": "https://www.example.com/",
        "email": "hello@example.com",
        "telephone": "+1-555-555-5555",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "City",
          "addressRegion": "ST",
          "addressCountry": "US"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
